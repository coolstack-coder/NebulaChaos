<!doctype html>
<html><head><meta charset="utf-8"><title>NebulaChaos stage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070912;--text:#e6e9f7;--dim:#8b93b8;--acc:#a78bfa;--cy:#22d3ee;--red:#f87171;--green:#4ade80}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;color:var(--text);font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(1100px 650px at 50% 38%,rgba(124,58,237,.32),transparent 70%),radial-gradient(800px 500px at 85% 90%,rgba(34,211,238,.10),transparent 70%),var(--bg)}
.scene{position:absolute;inset:0 0 150px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 160px}
.fade{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}.fade.on{opacity:1;transform:none}
h1{font-size:132px;margin:0;letter-spacing:-.045em;font-weight:900}h1 span{background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;color:transparent}
h2{font-size:44px;margin:18px 0 0;font-weight:600;color:#ddd6fe;letter-spacing:-.01em}
.by{margin-top:46px;font-size:30px;color:var(--dim)}.by b{color:var(--text)}
.tag{margin-top:18px;display:inline-block;padding:8px 20px;border:1px solid rgba(167,139,250,.5);border-radius:999px;color:#c4b5fd;font-size:21px}
.big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.15}.big em{font-style:normal;color:var(--red)}.big i{font-style:normal;color:var(--green)}
.lead{font-size:30px;color:#cbd5f5;line-height:1.5;margin-top:26px;max-width:1400px}
.q{display:flex;gap:28px;margin-top:44px}.q div{padding:22px 30px;border-radius:18px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.45);font-size:28px;font-weight:600;color:#fecaca}
.kicker{font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy);font-weight:700;margin-bottom:22px}
.flow{display:flex;align-items:center;gap:18px;margin-top:40px}.box{padding:22px 24px;border-radius:16px;background:#0e1222;border:1px solid #273056;min-width:230px}
.box b{display:block;font-size:24px;margin-bottom:6px}.box span{font-size:17px;color:var(--dim)}.arrow{font-size:40px;color:#4c5694}
.box.red{border-color:#dc2626;background:rgba(220,38,38,.08)}.box.green{border-color:#16a34a;background:rgba(22,163,74,.08)}
table{border-collapse:collapse;margin-top:30px;font-size:25px;text-align:left}td,th{padding:13px 22px;border-bottom:1px solid #1d2340}th{color:var(--dim);font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
td.r{color:#fca5a5;font-weight:700}td.g{color:#86efac;font-weight:700}
.stats{display:flex;gap:40px;margin-top:34px}.stat b{display:block;font-size:72px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;color:transparent}.stat span{font-size:21px;color:var(--dim)}
.mono{font-family:"JetBrains Mono",monospace;color:var(--cy);font-size:30px;margin-top:30px}
</style></head><body>
<div id="root"></div>
<script>
const scenes = {
intro: d => `<div class="scene"><div class="fade" style="transition-delay:.1s"><h1>Nebula<span>Chaos</span></h1></div>
  <div class="fade" style="transition-delay:.6s"><h2>My Raft cluster survived every crash test.<br>Then I made it lie.</h2></div>
  <div class="fade by" style="transition-delay:1.3s">by <b>Anmol Adwani</b></div>
  <div class="fade" style="transition-delay:1.7s"><span class="tag">Part 2 of the NebulaOS series</span></div></div>`,
context: d => `<div class="scene"><div class="fade kicker">Last time</div>
  <div class="fade big" style="transition-delay:.3s">NebulaOS — a small Kubernetes with Raft written from scratch —<br>recovered from a leader crash in <i>3.2 s</i>.</div>
  <div class="fade lead" style="transition-delay:1.4s">But surviving a crash is not the same as staying correct. Could it ever…</div>
  <div class="fade q" style="transition-delay:2.2s"><div>serve a stale read?</div><div>lose an acknowledged write?</div><div>apply a command twice?</div></div></div>`,
how: d => `<div class="scene"><div class="fade kicker">How NebulaChaos works</div>
  <div class="fade big" style="font-size:52px;transition-delay:.2s">Real processes. Real faults. Every operation recorded.</div>
  <div class="fade flow" style="transition-delay:.9s">
   <div class="box"><b>10–20 clients</b><span>read · write · compare-and-set</span></div><div class="arrow">→</div>
   <div class="box"><b>5 NebulaOS nodes</b><span>separate OS processes,<br>20 link proxies between them</span></div><div class="arrow">→</div>
   <div class="box"><b>History</b><span>invoke + complete time<br>of every operation</span></div><div class="arrow">→</div>
   <div class="box green"><b>Linearizability checker</b><span>own WGL search,<br>cross-checked with Porcupine</span></div></div>
  <div class="fade flow" style="transition-delay:1.6s"><div class="box red" style="min-width:1320px"><b>Nemesis</b><span>partitions (minority leader, rings, bridges) · SIGSTOP pauses · SIGKILL · power loss that drops un-fsynced bytes · bit rot in the Raft log and snapshots</span></div></div></div>`,
bug: d => `<div class="scene"><div class="fade kicker">Bug #${d.n}</div>
  <div class="fade big" style="transition-delay:.25s">${d.title}</div>
  <div class="fade lead" style="transition-delay:1s">${d.lead}</div></div>`,
fix: d => `<div class="scene"><div class="fade kicker" style="color:#4ade80">The fix</div>
  <div class="fade big" style="font-size:54px;transition-delay:.25s">${d.title}</div>
  <div class="fade lead" style="transition-delay:1s">${d.lead}</div></div>`,
results: d => `<div class="scene"><div class="fade kicker">Before and after</div>
  <div class="fade" style="transition-delay:.3s"><table><tr><th>bug</th><th>scenario</th><th>before the fix</th><th>after</th></tr>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]}</td><td class="g">${r[3]}</td></tr>`).join('')}</table></div>
  <div class="fade stats" style="transition-delay:1.2s">${d.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></div>`,
zoo: d => `<div class="scene"><div class="fade kicker">Does the checker actually work?</div>
  <div class="fade big" style="font-size:52px;transition-delay:.2s">I planted ${d.rows.length} known Raft bugs. It must catch them.</div>
  <div class="fade" style="transition-delay:1s"><table><tr><th>planted bug</th><th>caught?</th></tr>${d.rows.map(r=>`<tr><td>${r[0]}</td><td class="${r[2]?'g':'r'}">${r[1]}</td></tr>`).join('')}</table></div></div>`,
outro: d => `<div class="scene"><div class="fade"><h1 style="font-size:150px">Thank <span>you</span></h1></div>
  <div class="fade lead" style="transition-delay:.7s">The protocol was fine. The bugs lived in the plumbing around it.</div>
  <div class="fade by" style="transition-delay:1.3s"><b>Anmol Adwani</b></div>
  <div class="fade mono" style="transition-delay:1.7s">github.com/coolstack-coder/NebulaChaos</div>
  <div class="fade" style="transition-delay:2.2s"><span class="tag">Next: deterministic simulation testing</span></div></div>`,
};
window.show = (name, data) => {
  document.getElementById('root').innerHTML = scenes[name](data || {});
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.fade').forEach(e => e.classList.add('on'))));
};
</script></body></html>
